[package]
name = "orderbook"
version = "0.1.0"
edition = "2024"

[dependencies]
thiserror = "1.0"
log = "^0.4"
env_logger = "^0.11"
rand = "0.8"


[profile.release]
opt-level = 3
lto = true
codegen-units =  1
panic = "abort"
strip = "symbols"

[[bin]]
name = "main"
path = "src/main.rs"

[[bin]]
name = "benchmark"
path = "src/benchmark.rs"



[[bin]]
name = "latency"
path = "src/latency.rs"
